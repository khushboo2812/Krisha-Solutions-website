name: Deploy to HostAfrica

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at the same time.
concurrency:
  group: deploy-hostafrica
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Upload site/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          # Folder on the server, relative to where the FTP account logs in.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
