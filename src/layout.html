<!doctype html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#1a1259">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{pageDescription}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{siteUrl}}/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_KE">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/img/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css?v={{cssVersion}}">
  <script>document.documentElement.classList.add('js');window.KS_ANALYTICS={{{analyticsConfig}}};</script>
  {{{analyticsHead}}}
  {{{schemaJson}}}
</head>
<body class="{{bodyClass}}" {{{bodyData}}}>
  {{> icons}}
  {{> header}}
  <main id="main" tabindex="-1">
{{{content}}}
  </main>
  {{> footer}}
  <script src="/assets/js/main.js?v={{jsVersion}}" defer></script>
</body>
</html>
